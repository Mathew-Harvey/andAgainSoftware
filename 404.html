<script>
/* GitHub Pages serves this page for any missing address, at any depth, so relative links
   need a fixed starting point. On github.io the site lives in its first folder; on a
   domain of its own it lives at the root. The icon and the fonts are added here too, after
   the starting point is set, so the browser never asks for them at the wrong address. */
(function () {
  function add(tag, attrs) {
    var el = document.createElement(tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    document.head.appendChild(el);
  }
  add('base', { href: /\.github\.io$/.test(location.hostname) ? '/' + location.pathname.split('/')[1] + '/' : '/' });
  add('link', { rel: 'icon', type: 'image/png', href: 'favicon.png' });
  add('link', { rel: 'stylesheet', href: 'assets/css/fonts.css' });
})();
</script>
